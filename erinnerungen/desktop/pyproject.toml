[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erinnerungen"
version = "1.0.0"
description = "Minimale, private Aufgaben-App (Apple-Reminders-Klon) für Linux: GTK4/libadwaita, offline-first mit SQLite, CalDAV-Sync, GPLv3. Kein Account, keine Cloud, keine Telemetrie."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = ["python-dateutil>=2.8"]

[project.optional-dependencies]
# PyGObject/libadwaita kommen aus dem System (Debian/Ubuntu: python3-gi gir1.2-adw-1,
# Fedora: python3-gobject gtk4-devel libadwaita-devel), nicht aus pip.
gui = []
test = ["pytest>=8"]

[project.scripts]
erinnerungen = "erinnerungen.app:main"

[tool.setuptools]
packages = ["erinnerungen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
